# Hetzner: lives in ~/maha/ next to the shared ~/infra stack (traefik + cloudflared on the "proxy" network).
# No published ports: Traefik routes aham.byteofprash.com (and the old maha.byteofprash.com, until you drop it from the rule below)
# -> this container's port 3000.
services:
  maha:
    build: .
    image: maha
    container_name: maha
    restart: unless-stopped
    environment:
      - MAHA_PASSWORD=${MAHA_PASSWORD:-}
    volumes:
      # SQLite DB + backups live on the attached Hetzner volume. Set MAHA_DATA_DIR in ~/maha/.env on the server
      # (e.g. /mnt/HC_Volume_123456/maha). The folder must already exist: if the volume isn't mounted, start fails
      # loudly instead of silently creating an empty database on the root disk.
      - type: bind
        source: ${MAHA_DATA_DIR:?set MAHA_DATA_DIR in .env to a folder on the Hetzner volume}
        target: /app/data
        bind:
          create_host_path: false
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.maha.rule=Host(`aham.byteofprash.com`) || Host(`maha.byteofprash.com`)
      - traefik.http.routers.maha.entrypoints=web
      - traefik.http.services.maha.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
